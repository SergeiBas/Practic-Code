<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="uk">
<head>
  <meta charset="UTF-8">
  <title>Вхід до PortalCRM</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link rel="stylesheet" th:href="@{/css/style.css}">
  <style>
    .login-container {
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .login-card {
      width: 100%;
      max-width: 400px;
      padding: 30px;
      border-radius: 12px;
    }
  </style>
</head>
<body>

<div class="container login-container">
  <div class="form-card login-card shadow-lg">
    <div class="text-center mb-4">
      <h2 class="text-primary fw-bold"><i class="bi bi-shield-lock-fill"></i> PortalCRM</h2>
      <p class="text-muted small">Введіть ваші дані для входу в систему</p>
    </div>

    <div th:if="${param.error}" class="alert alert-danger py-2 small text-center" role="alert">
      <i class="bi bi-exclamation-triangle-fill"></i> Невірний логін або пароль!
    </div>

    <div th:if="${param.logout}" class="alert alert-success py-2 small text-center" role="alert">
      <i class="bi bi-check-circle-fill"></i> Ви успішно вийшли з системи.
    </div>

    <form th:action="@{/login}" method="POST">
      <div class="mb-3">
        <label for="username" class="form-label small fw-bold text-dark">Логін (Email або Ім'я)</label>
        <div class="input-group">
          <span class="input-group-text bg-transparent border-end-0 text-muted"><i class="bi bi-person"></i></span>
          <input type="text" id="username" name="username" class="form-control border-start-0" placeholder="admin" required autofocus>
        </div>
      </div>

      <div class="mb-4">
        <label for="password" class="form-label small fw-bold text-dark">Пароль</label>
        <div class="input-group">
          <span class="input-group-text bg-transparent border-end-0 text-muted"><i class="bi bi-lock"></i></span>
          <input type="password" id="password" name="password" class="form-control border-start-0" placeholder="••••••••" required>
        </div>
      </div>

      <button type="submit" class="btn btn-primary w-100 fw-bold py-2 shadow-sm mb-3">
        <i class="bi bi-box-arrow-in-right"></i> Увійти в систему
      </button>

      <div class="text-center border-top pt-3">
        <p class="text-muted small mb-2">Новий співробітник?</p>
        <a href="/register/check-email" class="btn btn-outline-success btn-sm fw-bold w-100">
          <i class="bi bi-person-plus"></i> Створити акаунт (за запрошенням)
        </a>
      </div>

    </form>
  </div>
</div>

<script>
  // Автоматична синхронізація теми на сторінці логіну
  document.addEventListener("DOMContentLoaded", function() {
    const savedTheme = localStorage.getItem('theme') || 'light';
    document.documentElement.setAttribute('data-bs-theme', savedTheme);
  });
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
