<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Налаштування профілю</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        .profile-card { background: white; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); overflow: hidden; }
        .sidebar-profile { background: #f8f9fa; border-right: 1px solid #eee; padding: 2rem; }
        .avatar-preview { width: 150px; height: 150px; object-fit: cover; border-radius: 50%; border: 4px solid #fff; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        body.bg-dark {
            background-color: #121212 !important;
            color: #e0e0e0 !important;
        }
        .bg-dark .profile-card {
            background-color: #1e1e1e !important;
            color: #ffffff !important;
            border: 1px solid #333 !important;
        }
        .bg-dark .sidebar-profile {
            background-color: #252525 !important;
            border-right: 1px solid #333 !important;
        }
        .bg-dark .form-control {
            background-color: #2c2c2c !important;
            border: 1px solid #444 !important;
            color: #ffffff !important;
        }
        .bg-dark .form-control:focus {
            background-color: #333 !important;
            border-color: #0d6efd !important;
        }
        .bg-dark .text-muted {
            color: #a0a0a0 !important;
        }
        .bg-dark h4, .bg-dark h5, .bg-dark label {
            color: #ffffff !important;
        }
        .bg-dark .badge {
            color: #fff !important;
        }
        .hint-text {
            color: #b0b0b0 !important;
            font-size: 0.85rem;
            margin-top: 0.25rem;
        }
        .bg-dark .modal-content {
            background-color: #1e1e1e !important;
            color: #ffffff !important;
            border: 1px solid #333 !important;
        }
        .bg-dark .modal-header, .bg-dark .modal-footer {
            border-color: #333 !important;
        }
        .bg-dark .form-control, .bg-dark .form-select {
            background-color: #2c2c2c !important;
            border: 1px solid #444 !important;
            color: #ffffff !important;
        }
        .bg-dark .form-select option {
            background-color: #2c2c2c !important;
        }
        .bg-dark .btn-close {
            filter: invert(1) grayscale(100%) brightness(200%);
        }
    </style>
</head>
<body class="bg-light py-5">

<div class="container">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="profile-card d-flex flex-column flex-md-row">

                <div class="sidebar-profile text-center">
                    <img th:src="${currentUser.avatarPath != null ? currentUser.avatarPath : '/images/default-avatar.png'}"
                         class="avatar-preview mb-3">
                    <h5 class="fw-bold" th:text="${currentUser.firstName + ' ' + currentUser.lastName}">Ім'я</h5>
                    <p class="text-muted small" th:text="${currentUser.email}">email</p>
                    <span class="badge bg-primary px-3 rounded-pill" th:text="${currentUser.roles[0].name.replace('ROLE_', '')}">ROLE</span>
                </div>


                <div class="p-4 flex-grow-1">
                    <h4 class="mb-4"><i class="bi bi-pencil-square"></i> Редагування даних</h4>
                    <a href="/" class="btn btn-outline-secondary btn-sm mb-3">
                        <i class="bi bi-arrow-left"></i> Повернутись на головну
                    </a>

                    <div th:if="${param.success}" class="alert alert-success alert-dismissible fade show" role="alert">
                        Профіль успішно оновлено!
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>

                    <form th:action="@{/profile/update}" method="POST" enctype="multipart/form-data">
                        <div class="mb-3">
                            <label class="small fw-bold">Змінити аватар</label>
                            <input type="file" name="avatarFile" class="form-control form-control-sm">
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="small fw-bold">Ім'я</label>
                                <input type="text" name="firstName" th:value="${currentUser.firstName}" class="form-control">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="small fw-bold">Прізвище</label>
                                <input type="text" name="lastName" th:value="${currentUser.lastName}" class="form-control">
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="small fw-bold">Новий пароль</label>
                            <input type="password" name="password" class="form-control">
                            <div class="hint-text">Залиште порожнім, якщо не змінюєте</div>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 mb-4"><i class="bi bi-check2-circle"></i> Зберегти зміни</button>
                    </form>

                    <div th:if="${#authorization.expression('hasRole(''ROLE_IT'')')}" class="border-top pt-4">
                        <h5 class="text-primary mb-3"><i class="bi bi-shield-lock"></i> Панель адміністратора</h5>
                        <button class="btn btn-outline-success w-100" data-bs-toggle="modal" data-bs-target="#inviteModal">
                            <i class="bi bi-plus-circle"></i> Додати новий Email для реєстрації
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>


<div class="modal fade" id="inviteModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <form th:action="@{/admin/add-invite}" method="POST">
                <div class="modal-header">
                    <h5 class="modal-title">Новий інвайт</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <input type="email" name="email" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <select name="roleId" class="form-select">
                            <option value="1">HR</option>
                            <option value="2">MANAGER</option>
                            <option value="3">IT</option>
                        </select>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Скасувати</button>
                    <button type="submit" class="btn btn-success">Додати в вайтліст</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/js/bootstrap.bundle.min.js"></script>
<script>
    // Функція, що застосовує тему
    function applyTheme(theme) {
        if (theme === 'dark') {
            document.body.classList.add('bg-dark', 'text-light');
            // Знаходимо картку і додаємо їй темні класи
            const card = document.querySelector('.profile-card');
            if (card) card.classList.add('bg-dark', 'text-light');
        } else {
            document.body.classList.remove('bg-dark', 'text-light');
            const card = document.querySelector('.profile-card');
            if (card) card.classList.remove('bg-dark', 'text-light');
        }
    }

    // 1. Одразу застосовуємо тему при завантаженні сторінки
    const savedTheme = localStorage.getItem('theme') || 'light';
    applyTheme(savedTheme);

    // 2. Якщо в тебе є кнопка перемикання теми на цій сторінці - додаємо обробник
    const themeToggle = document.getElementById('theme-toggle');
    if (themeToggle) {
        themeToggle.addEventListener('click', () => {
            const currentTheme = localStorage.getItem('theme') === 'dark' ? 'light' : 'dark';
            localStorage.setItem('theme', currentTheme);
            applyTheme(currentTheme);
        });
    }
</script>
</body>
</html>
